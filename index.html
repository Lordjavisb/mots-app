<style>
:root{--ground:#F5F0E7;--surface:#FFFDF8;--ink:#1E1B17;--muted:#5E574D;--line:#E2DACB;--accent:#2F4B8C;--accent-soft:#E6EBF5;--chip-line:#CFC5B1;--seg:#E9E2D4}
:root[data-lang="ar"]{--accent-soft:#E3EEE8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 20px 120px;min-height:100dvh}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:12px}
h1,h2{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-.5px;margin:0}
h1{font-size:30px}h2{font-size:30px;margin-top:24px}
.tag{font-size:13px;color:var(--muted)}
.seg{margin-top:18px;display:flex;background:var(--seg);border-radius:14px;padding:4px}
.seg button{flex:1;height:42px;border:0;border-radius:11px;background:transparent;color:#4A4439;font:600 15px 'Instrument Sans',sans-serif;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg button.ar{font:700 18px 'Amiri',serif}
.lbl{display:block;margin-top:20px;font-size:13px;color:var(--muted)}
.field{position:relative;margin-top:8px}
.field svg{position:absolute;left:16px;top:16px;pointer-events:none}
input[type=search]{box-sizing:border-box;width:100%;height:52px;border:1px solid #D8CFBD;border-radius:14px;background:var(--surface);padding:0 16px 0 46px;font:500 18px 'Instrument Sans',sans-serif;color:var(--ink);-webkit-appearance:none;appearance:none}
input[dir=rtl]{font-family:'Amiri',serif;font-weight:700;font-size:20px}
.hint{margin-top:6px;font-size:12px;color:var(--muted);min-height:16px}
.card{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px}
.h-term{font-family:'Fraunces',Georgia,serif;font-size:32px;font-weight:600;letter-spacing:-.5px;overflow-wrap:anywhere}
.h-term[dir=rtl]{font-family:'Amiri',serif;font-size:42px;font-weight:700;line-height:1.2;text-align:right}
.pos{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:5px 10px;white-space:nowrap}
.sense{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.tr{font-size:13px;color:var(--muted)}
.sub{font-size:14px;color:var(--muted)}
.kicker{margin-top:14px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.defs{margin:10px 0 0;padding-left:20px;font-size:15px;line-height:1.45}
.chips{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);background:transparent;font:500 15px 'Instrument Sans',sans-serif;cursor:pointer;min-height:40px;text-align:center}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff}
.chip.ar{font:700 19px 'Amiri',serif}
.chip .ctr{display:block;font:400 12px 'Instrument Sans',sans-serif;margin-top:2px;opacity:.9}
.ex{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.ex .src{font-size:16px;line-height:1.4}
.ex .src[dir=rtl]{font-family:'Amiri',serif;font-size:21px;text-align:right;line-height:1.5}
.ex .es{font-size:14px;color:var(--muted);font-style:italic;line-height:1.4}
.ex .tr{margin-top:0}
.btn-primary{width:100%;height:50px;border:0;border-radius:14px;background:var(--accent);color:#fff;font:600 16px 'Instrument Sans',sans-serif;cursor:pointer;margin-top:14px}
.btn-ghost{height:48px;border:1px solid var(--chip-line);border-radius:14px;background:transparent;color:var(--ink);font:600 15px 'Instrument Sans',sans-serif;cursor:pointer;padding:0 16px}
.item{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 10px 14px 16px;border-bottom:1px solid #EFE9DD}
.item:last-child{border-bottom:0}
.item-main{flex:1;min-width:0}
.it-term{font-family:'Fraunces',Georgia,serif;font-size:19px;font-weight:600;overflow-wrap:anywhere}
.it-term[dir=rtl]{font-family:'Amiri',serif;font-size:22px;font-weight:700;text-align:right}
.list{margin:14px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.icon-btn{width:44px;height:44px;border:0;border-radius:12px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.review-card{text-align:center;padding:36px 18px}
.review-card .h-term{font-size:40px}
.review-card .h-term[dir=rtl]{text-align:center;font-size:52px}
.actions{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions .btn-ghost,.actions .btn-primary{margin-top:0}
.msg{margin-top:14px;font-size:13px;color:var(--muted);line-height:1.4}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav{display:flex;max-width:520px;margin:0 auto;height:80px;padding:8px 16px 0}
.nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 12px 'Instrument Sans',sans-serif;color:var(--muted);cursor:pointer;min-height:44px}
.nav button[aria-current="page"]{color:var(--accent)}
.hidden{display:none !important}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

<body>
<div class="app">
  <header>
    <h1>Mots</h1>
    <span class="tag">Diccionario de bolsillo</span>
  </header>

  <div class="seg" role="group" aria-label="Idioma de destino">

    <button type="button" data-lang="ar" class="ar" aria-pressed="false">العربية</button>
  </div>

  <section id="view-search" aria-label="Buscar">
    <form id="searchForm" role="search">
      <label class="lbl" for="q" id="qLabel">Palabra o frase en francés o castellano</label>
      <div class="field">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E574D" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" placeholder="Escribe y pulsa buscar">
      </div>
      <div class="hint" id="hint" aria-live="polite"></div>
    </form>
    <div id="results" aria-live="polite"></div>
  </section>

  <section id="view-list" class="hidden" aria-label="Mi vocabulario">
    <h2>Mi vocabulario</h2>
    <div class="tag" id="listMeta"></div>
    <div class="field" style="margin-top:14px">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E574D" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="filterList" type="search" placeholder="Filtrar mis palabras" aria-label="Filtrar mis palabras">
    </div>
    <button type="button" class="btn-primary" id="startReview2">Repasar</button>

</div>

<nav aria-label="Principal">
  <div class="nav">
    <button type="button" data-view="search" aria-current="page">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Buscar
    </button>
    <button type="button" data-view="list">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
      Lista (<span id="count">0</span>)
    </button>
    <button type="button" data-view="review">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="7" width="13" height="13" rx="2"/><path d="M7 4h12a2 2 0 0 1 2 2v12"/></svg>
      Repaso
    </button>
  </div>
</nav>

<script>
/* ---------- Configuración ---------- */
const MM_API = 'https://api.mymemory.translated.net/get';
const WIKT_FR_API = 'https://fr.wiktionary.org/w/api.php';
const LANGS = {
  fr: { label: 'Francés', store: 'vocab_fr', accent: '#2F4B8C', rtl: false, placeholder: 'Escribe y pulsa buscar' },
  ar: { label: 'Árabe',   store: 'vocab_ar', accent: '#2E6B4F', rtl: true,  placeholder: 'اكتب ثم اضغط بحث' }
};
const NAMES = { fr: 'Francés', ar: 'Árabe', es: 'Castellano' };
const POS_ES = { nom: 'sustantivo', verbe: 'verbo', adjectif: 'adjetivo', adverbe: 'adverbio', 'préposition': 'preposición', conjonction: 'conjunción', pronom: 'pronombre', interjection: 'interjección', locution: 'locución' };

const S = {
  lang: 'fr', view: 'search', groups: null, abort: null,
  saved: { fr: new Set(), ar: new Set() },
  review: [], ri: 0, revealed: false
};
const WIKT_CACHE = new Map();

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hasAr = s => /[؀-ۿ]/.test(s);
const normalize = s => String(s).trim().replace(/\s+/g, ' ');
const keyOf = (term, gloss) => term.toLowerCase() + '|' + gloss.toLowerCase();
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function uniqBy(arr) {
  const seen = new Map();
  for (const x of arr) { const k = x.trim().toLowerCase(); if (k && !seen.has(k)) seen.set(k, x.trim()); }
  return [...seen.values()];
}

/* ---------- Base de datos local (IndexedDB) ---------- */
let DBP = null;
function openDB() {
  if (!DBP) DBP = new Promise((ok, ko) => {
    const r = indexedDB.open('mots', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      for (const cfg of Object.values(LANGS)) {
        if (!d.objectStoreNames.contains(cfg.store)) d.createObjectStore(cfg.store, { keyPath: 'id' });
      }
    };
    r.onsuccess = () => ok(r.result);
    r.onerror = () => ko(r.error);
  });
  return DBP;
}
async function dbRun(store, mode, fn) {
  const d = await openDB();
  return new Promise((ok, ko) => {
    const t = d.transaction(store, mode);
    const req = fn(t.objectStore(store));
    t.oncomplete = () => ok(req ? req.result : undefined);
    t.onerror = () => ko(t.error);
    t.onabort = () => ko(t.error);
  });
}
const dbAll = store => dbRun(store, 'readonly', s => s.getAll());
const dbPut = (store, rec) => dbRun(store, 'readwrite', s => s.put(rec));
const dbDel = (store, id) => dbRun(store, 'readwrite', s => s.delete(id));

async function refreshSaved() {
  for (const [code, cfg] of Object.entries(LANGS)) {
    const all = await dbAll(cfg.store);
    S.saved[code] = new Set(all.map(r => r.id));
  }
  updateCount();
}
function updateCount() { $('#count').textContent = S.saved[S.lang].size; }

/* ---------- Wiktionary francés (fuente principal para palabras francesas) ---------- */
async function wiktFr(term, signal) {
  const key = term.toLowerCase();
  if (WIKT_CACHE.has(key)) return WIKT_CACHE.get(key);
  const url = `${WIKT_FR_API}?action=query&prop=revisions&rvprop=content&rvslots=main&redirects=1&format=json&formatversion=2&origin=*&titles=${encodeURIComponent(term)}`;
  const r = await fetch(url, { signal });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  const page = j.query && j.query.pages && j.query.pages[0];
  const rev = page && !page.missing && page.revisions && page.revisions[0];
  const content = rev && rev.slots && rev.slots.main && rev.slots.main.content;
  const res = content ? parseFrWikitext(content) : null;
  WIKT_CACHE.set(key, res);
  return res;
}
/* Elimina plantillas y marcado wiki de un fragmento */
function clean(s) {
  let t = s;
  for (let i = 0; i < 3; i++) t = t.replace(/\{\{[^{}]*\}\}/g, '');
  return t.replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g, '$1').replace(/'{2,}/g, '').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
}
/* Extrae la sección del idioma francés (== {{langue|fr}} ==) */
function frSection(wt) {
  const h = /^==\s*\{\{langue\|fr\}\}\s*==[^\n]*$/m.exec(wt);
  if (!h) return null;
  const from = h.index + h[0].length;
  const nx = /^==\s*\{\{langue\|/m.exec(wt.slice(from));
  return wt.slice(h.index, nx ? from + nx.index : wt.length);
}
/* Traducciones de una lengua: {{trad+|es|libro|m}}, {{trad|ar|كتاب|tr=...|dif=...}} */
function trads(text, lang) {
  const re = new RegExp('\\{\\{trad[+-]?\\|' + lang + '\\|([^|}]+)[^}]*\\}\\}', 'g');
  const out = [];
  let m;
  while ((m = re.exec(text))) {
    const dif = /\|dif=([^|}]+)/.exec(m[0]);
    const tr = /\|tr=([^|}]+)/.exec(m[0]);
    out.push({ term: clean(m[1]), dif: dif ? dif[1].trim() : '', tr: tr ? tr[1].trim() : '' });
  }
  return out;
}
/* Una categoría gramatical (su bloque de texto, desde su cabecera hasta la siguiente) */
function parseSenseBlock(block) {
  const genM = /'''[^'\n]+'''[^\n]*?\{\{([mf])\}\}/.exec(block);
  const defs = [...block.matchAll(/^#(?![*:#])\s*(.+)$/gm)].map(m => clean(m[1])).filter(Boolean).slice(0, 3);
  const es = uniqBy(trads(block, 'es').map(x => x.term)).slice(0, 6);
  const seen = new Set();
  const ar = [];
  for (const x of trads(block, 'ar')) {
    const shown = x.dif || x.term;
    if (!seen.has(shown)) { seen.add(shown); ar.push({ shown, tr: x.tr }); }
  }
  return { gender: genM ? genM[1] : '', defs, es, ar: ar.slice(0, 6) };
}
function parseFrWikitext(wt) {
  const sec = frSection(wt);
  if (!sec) return null;
  const heads = [...sec.matchAll(/^===\s*\{\{S\|([^|}]+)\|fr[|}]/gm)];
  if (!heads.length) return null;
  const senses = heads.map((h, i) => {
    const end = i + 1 < heads.length ? heads[i + 1].index : sec.length;
    return { pos: POS_ES[h[1]] || h[1], ...parseSenseBlock(sec.slice(h.index, end)) };
  }).filter(s => s.defs.length || s.es.length || s.ar.length);
  if (!senses.length) return null;
  const ipaM = /\{\{pron\|([^|}]+)\|fr/.exec(sec);
  const examples = [...sec.matchAll(/^#\*\s*(.+)$/gm)].map(m => clean(m[1])).filter(x => x.length >= 20 && !/source/i.test(x)).slice(0, 2);
  return { ipa: ipaM ? ipaM[1] : '', senses, examples };
}

/* ---------- MyMemory (respaldo y dirección castellano → árabe/francés) ---------- */
async function mm(text, from, to, signal) {
  const url = `${MM_API}?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;
  const r = await fetch(url, { signal });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  const main = (j.responseData && j.responseData.translatedText || '').trim();
  if (/MYMEMORY WARNING|QUERY LENGTH|INVALID|NO QUERY/i.test(main)) throw new Error('límite del servicio o consulta no válida');
  const low = text.toLowerCase();
  const matches = (j.matches || [])
    .filter(x => x.segment && x.translation)
    .map(x => ({ seg: x.segment.trim(), tr: x.translation.trim(), match: Number(x.match) || 0 }));
  const wordMatches = matches
    .filter(x => x.seg.toLowerCase() === low && x.tr.toLowerCase() !== low)
    .sort((a, b) => b.match - a.match)
    .map(x => x.tr);
  const equivs = uniqBy([main, ...wordMatches]).slice(0, 6);
  const examples = matches
    .filter(x => x.seg.toLowerCase() !== low && x.seg.split(/\s+/).length >= 3)
    .sort((a, b) => b.match - a.match)
    .slice(0, 3);
  return { equivs, examples, from, to };
}
function pairsFor(query) {
  if (hasAr(query)) return [{ from: 'ar', to: 'es' }];
  if (S.lang === 'fr') return [{ from: 'fr', to: 'es' }, { from: 'es', to: 'fr' }];
  return [{ from: 'es', to: 'ar' }];
}
function hintFor(pairs) {
  if (pairs.length === 2) return 'Busca en ambos sentidos: francés → castellano y castellano → francés.';
  return pairs[0].from === 'ar' ? 'Árabe → castellano.' : 'Castellano → árabe.';
}

/* ---------- Transliteración árabe (aproximada, solo texto vocalizado) ---------- */
const CONS = { 'ء':'ʾ','ب':'b','ت':'t','ث':'th','ج':'j','ح':'ḥ','خ':'kh','د':'d','ذ':'dh','ر':'r','ز':'z','س':'s','ش':'sh','ص':'ṣ','ض':'ḍ','ط':'ṭ','ظ':'ẓ','ع':'ʿ','غ':'gh','ف':'f','ق':'q','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','و':'w','ي':'y','ة':'a','ى':'ā','ا':'','آ':'ʾā','أ':'ʾ','إ':'ʾ','ؤ':'ʾ','ئ':'ʾ' };
const VOW = { 'َ':'a', 'ُ':'u', 'ِ':'i', 'ً':'an', 'ٌ':'un', 'ٍ':'in', 'ْ':'' };
function translitWord(word) {
  const units = [];
  for (const ch of word) {
    if (ch === 'ـ' || ch === 'ٱ') continue;
    if (CONS[ch] !== undefined) units.push({ b: ch, t: CONS[ch], v: '', d: false });
    else if (ch === 'ّ') { if (units.length) units[units.length - 1].d = true; }
    else if (VOW[ch] !== undefined) { if (units.length) units[units.length - 1].v = VOW[ch]; }
    else if (/[ً-ْ]/.test(ch)) continue;
    else units.push({ raw: ch });
  }
  const article = units.length > 1 && units[0].b === 'ا' && !units[0].v && units[1].b === 'ل';
  const parts = [];
  units.forEach((u, idx) => {
    if (u.raw !== undefined) { parts.push({ t: u.raw, v: '' }); return; }
    let t = u.t, v = u.v;
    if (article && idx === 0) { parts.push({ t: 'a', v: '' }); return; }
    if (article && idx === 1) { parts.push({ t: 'l-', v: v }); return; }
    if (u.b === 'ا' || u.b === 'ى' || u.b === 'آ') {
      if (u.b === 'آ') { parts.push({ t: 'ʾā', v: '' }); return; }
      const prev = parts.filter(p => !p.raw).pop();
      if (idx === 0 && !v) return;
      if (!v && prev && prev.v === 'a') { prev.v = 'ā'; return; }
      if (!v) return;
      parts.push({ t: '', v: v });
      return;
    }
    if ((u.b === 'و' || u.b === 'ي') && !v && idx > 0) {
      const prev = parts[parts.length - 1];
      if (prev && u.b === 'و' && prev.v === 'u') { prev.v = 'ū'; return; }
      if (prev && u.b === 'ي' && prev.v === 'i') { prev.v = 'ī'; return; }
    }
    if (u.b === 'ة') { parts.push({ t: 'a', v: '' }); return; }
    if (u.d) t = t + t;
    parts.push({ t, v });
  });
  return parts.map(p => p.t + p.v).join('');
}
function translit(text) {
  if (!/[ً-ْ]/.test(text)) return null;
  return text.split(/(\s+)/).map(w => hasAr(w) ? translitWord(w) : w).join('');
}

/* ---------- Búsqueda ---------- */
async function doSearch(e) {
  if (e) e.preventDefault();
  const q = normalize($('#q').value);
  if (!q) return;
  if (q.length > 300) { showMsg('La consulta es demasiado larga.'); return; }
  if (hasAr(q) && S.lang !== 'ar') setLang('ar');
  if (S.abort) S.abort.abort();
  const ctl = new AbortController();
  S.abort = ctl;
  $('#results').innerHTML = '<p class="msg">Buscando…</p>';
  $('#hint').textContent = '';
  try {
    if (!hasAr(q) && S.lang === 'fr') {
      let w = null;
      try { w = await wiktFr(q, ctl.signal); }
      catch (err) { if (err.name === 'AbortError') throw err; w = null; }
      if (w) {
        S.groups = [{ kind: 'wikt', query: q, ...w }];
        $('#hint').textContent = 'Entrada francesa de Wiktionary.';
        renderResults();
        return;
      }
    }
    const pairs = pairsFor(q);
    $('#hint').textContent = hintFor(pairs);
    const groups = await Promise.all(pairs.map(p => mm(q, p.from, p.to, ctl.signal).then(r => ({ ...r, kind: 'mm', query: q }))));
    S.groups = groups;
    renderResults();
  } catch (err) {
    if (err.name === 'AbortError') return;
    S.groups = null;
    showMsg('No se pudo consultar el diccionario (' + err.message + '). Comprueba la conexión. Tu lista guardada sigue disponible.');
  }
}
function showMsg(text) { $('#results').innerHTML = `<p class="msg">${esc(text)}</p>`; }

/* ---------- Render ---------- */
function chipHtml({ label, term, gloss, ar, tr }) {
  const pressed = S.saved[S.lang].has(keyOf(term, gloss));
  return `<button type="button" class="chip${ar ? ' ar' : ''}" data-term="${esc(term)}" data-gloss="${esc(gloss)}" aria-pressed="${pressed}"${ar ? ' dir="rtl" lang="ar"' : ''}>${esc(label)}${tr ? `<span class="ctr" dir="ltr">${esc(tr)}</span>` : ''}</button>`;
}
function lineHtml(text, lang, cls) {
  if (lang === 'ar') {
    const tl = translit(text);
    return `<div class="src" dir="rtl" lang="ar">${esc(text)}</div>${tl ? `<div class="tr">/${esc(tl)}/</div>` : ''}`;
  }
  return `<div class="${cls}">${esc(text)}</div>`;
}
function senseHtml(q, s) {
  const meta = [s.pos, s.gender ? (s.gender === 'm' ? 'masc.' : 'fem.') : ''].filter(Boolean).join(' · ');
  const defs = s.defs.length ? `<ol class="defs">${s.defs.map(d => `<li>${esc(d)}</li>`).join('')}</ol>` : '';
  const es = s.es.length
    ? `<div class="chips">${s.es.map(t => chipHtml({ label: t, term: q, gloss: t, ar: false })).join('')}</div>`
    : '<p class="sub" style="margin-top:8px">Sin traducción al castellano en esta acepción.</p>';
  const ar = s.ar.length
    ? `<div class="chips">${s.ar.map(a => chipHtml({ label: a.shown, term: q, gloss: a.shown, ar: true, tr: a.tr })).join('')}</div>`
    : '<p class="sub" style="margin-top:8px">Sin traducción al árabe en esta acepción.</p>';
  return `
    <div class="sense">
      ${meta ? `<span class="pos">${esc(meta)}</span>` : ''}
      ${defs}
      <div class="kicker">Castellano · toca para guardar</div>
      ${es}
      <div class="kicker">Árabe · toca para guardar</div>
      ${ar}
    </div>`;
}
function wiktCard(g) {
  const q = g.query;
  const exs = g.examples.map(x => `<div class="ex"><div class="src">${esc(x)}</div></div>`).join('');
  return `
    <article class="card">
      <div class="h-term">${esc(q)}</div>
      ${g.ipa ? `<div class="tr">[${esc(g.ipa)}]</div>` : ''}
      ${g.senses.map(s => senseHtml(q, s)).join('')}
      ${exs ? `<div class="kicker">Ejemplos (francés)</div>${exs}` : ''}
    </article>`;
}
function mmCard(g) {
  const q = g.query;
  const qAr = hasAr(q);
  const tl = qAr ? translit(q) : null;
  const eqLang = g.from === S.lang ? g.to : g.from;
  const chips = g.equivs.length
    ? `<div class="chips">${g.equivs.map(eq => {
        const isAr = eqLang === 'ar';
        return chipHtml({ label: eq, term: g.from === S.lang ? q : eq, gloss: g.from === S.lang ? eq : q, ar: isAr, tr: isAr ? translit(eq) : null });
      }).join('')}</div>`
    : '<p class="sub" style="margin-top:8px">Sin equivalencias encontradas.</p>';
  const exs = g.examples.map(ex =>
    `<div class="ex">${lineHtml(ex.seg, g.from, 'src')}${lineHtml(ex.tr, g.to, 'es')}</div>`
  ).join('');
  return `
    <article class="card">
      <div class="kicker" style="margin-top:0">${esc(NAMES[g.from])} → ${esc(NAMES[g.to])}</div>
      <div class="h-term" ${qAr ? 'dir="rtl" lang="ar"' : ''} style="margin-top:6px">${esc(q)}</div>
      ${tl ? `<div class="tr">/${esc(tl)}/</div>` : ''}
      <div class="kicker">Equivalentes · toca para guardar</div>
      ${chips}
      ${exs ? `<div class="kicker">Ejemplos</div>${exs}` : ''}
    </article>`;
}
function renderResults() {
  const box = $('#results');
  if (!S.groups || !S.groups.length) { box.innerHTML = ''; return; }
  const isWikt = S.groups[0].kind === 'wikt';
  box.innerHTML = S.groups.map(g => g.kind === 'wikt' ? wiktCard(g) : mmCard(g)).join('')
    + `<p class="msg">${isWikt
        ? 'Fuente: Wiktionary (fr.wiktionary.org), licencia CC BY-SA 4.0.'
        : 'Fuente: MyMemory (memorias de traducción). Wiktionary no tenía entrada francesa para este término.'}</p>`;
}

/* ---------- Guardar / quitar ---------- */
async function toggleSave(term, gloss) {
  const id = keyOf(term, gloss);
  const store = LANGS[S.lang].store;
  if (S.saved[S.lang].has(id)) {
    await dbDel(store, id);
    S.saved[S.lang].delete(id);
  } else {
    await dbPut(store, { id, term, gloss, savedAt: Date.now(), reviews: 0, known: 0 });
    S.saved[S.lang].add(id);
  }
  renderResults();
  updateCount();
}

/* ---------- Lista ---------- */
async function renderList() {
  const cfg = LANGS[S.lang];
  const all = (await dbAll(cfg.store)).sort((a, b) => b.savedAt - a.savedAt);
  const f = normalize($('#filterList').value).toLowerCase();
  const rows = all.filter(r => !f || (r.term + ' ' + r.gloss).toLowerCase().includes(f));
  $('#listMeta').textContent = `Base de datos: ${cfg.label} · ${all.length} palabras`;
  $('#wordList').innerHTML = rows.length
    ? rows.map(r => `
        <li class="item">
          <div class="item-main">
            <div class="it-term" ${cfg.rtl ? 'dir="rtl" lang="ar"' : ''}>${esc(r.term)}</div>
            <div class="sub" dir="auto">${esc(r.gloss)}</div>
          </div>
          <button type="button" class="icon-btn" data-del="${esc(r.id)}" aria-label="Quitar ${esc(r.term)}">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E574D" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </li>`).join('')
    : `<li class="item sub">${all.length ? 'Ningún resultado para el filtro.' : `Aún no tienes palabras guardadas en ${cfg.label.toLowerCase()}.`}</li>`;
}

/* ---------- Repaso ---------- */
async function startReview() {
  const all = await dbAll(LANGS[S.lang].store);
  if (!all.length) {
    $('#reviewBox').innerHTML = '<p class="msg">Guarda palabras desde la búsqueda para empezar a repasar.</p>';
    return;
  }
  S.review = shuffle(all).slice(0, 12);
  S.ri = 0;
  S.revealed = false;
  drawReview();
}
function drawReview() {
  const box = $('#reviewBox');
  if (S.ri >= S.review.length) {
    box.innerHTML = `<p class="msg">Sesión terminada: ${S.review.length} palabras repasadas.</p>
      <button type="button" class="btn-primary" data-action="again">Repetir sesión</button>`;
    return;
  }
  const r = S.review[S.ri];
  const rtl = LANGS[S.lang].rtl;
  const tl = rtl ? translit(r.term) : null;
  box.innerHTML = `
    <div class="tag">${S.ri + 1} de ${S.review.length}</div>
    <article class="card review-card">
      <div class="h-term" ${rtl ? 'dir="rtl" lang="ar"' : ''}>${esc(r.term)}</div>
      ${tl ? `<div class="tr">/${esc(tl)}/</div>` : ''}
      ${S.revealed
        ? `<div class="sub" dir="auto" style="margin-top:14px;font-size:18px;color:var(--ink)">${esc(r.gloss)}</div>`
        : '<button type="button" class="btn-ghost" data-action="reveal" style="margin-top:18px">Mostrar traducción</button>'}
    </article>
    ${S.revealed ? `<div class="actions">
      <button type="button" class="btn-ghost" data-action="know" data-ok="0">Repetir</button>
      <button type="button" class="btn-primary" data-action="know" data-ok="1">La sabía</button>
    </div>` : ''}`;
}
async function answer(ok) {
  const r = S.review[S.ri];
  r.reviews = (r.reviews || 0) + 1;
  if (ok) r.known = (r.known || 0) + 1;
  await dbPut(LANGS[S.lang].store, r);
  S.ri++;
  S.revealed = false;
  drawReview();
}

/* ---------- Idioma y vistas ---------- */
function setLang(code) {
  S.lang = code;
  document.documentElement.dataset.lang = code;
  document.documentElement.style.setProperty('--accent', LANGS[code].accent);
  document.querySelectorAll('.seg [data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === code)));
  $('#qLabel').textContent = code === 'ar' ? 'Palabra o frase en castellano o árabe' : 'Palabra o frase en francés o castellano';
  $('#q').placeholder = LANGS[code].placeholder;
  $('#q').dir = LANGS[code].rtl ? 'auto' : 'ltr';
  S.groups = null;
  renderResults();
  $('#hint').textContent = '';
  updateCount();
  if (S.view === 'list') renderList();
  if (S.view === 'review') startReview();
}
function setView(v) {
  S.view = v;
  ['search', 'list', 'review'].forEach(n => $('#view-' + n).classList.toggle('hidden', n !== v));
  document.querySelectorAll('nav [data-view]').forEach(b => {
    if (b.dataset.view === v) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  if (v === 'list') renderList();
  if (v === 'review') startReview();
  window.scrollTo(0, 0);
}

/* ---------- Eventos ---------- */
document.querySelectorAll('.seg [data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
document.querySelectorAll('nav [data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
$('#searchForm').addEventListener('submit', doSearch);
$('#results').addEventListener('click', e => {
  const b = e.target.closest('[data-term]');
  if (!b) return;
  toggleSave(b.dataset.term, b.dataset.gloss);
});
$('#filterList').addEventListener('input', renderList);
$('#wordList').addEventListener('click', async e => {
  const b = e.target.closest('[data-del]');
  if (!b) return;
  const id = b.dataset.del;
  await dbDel(LANGS[S.lang].store, id);
  S.saved[S.lang].delete(id);
  updateCount();
  renderList();
});
$('#startReview2').addEventListener('click', startReview);
$('#reviewBox').addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const a = b.dataset.action;
  if (a === 'reveal') { S.revealed = true; drawReview(); }
  else if (a === 'know') answer(b.dataset.ok === '1');
  else if (a === 'again') startReview();
});

/* ---------- Arranque ---------- */
(async function init() {
  try {
    await refreshSaved();
  } catch (err) {
    console.error('IndexedDB no disponible', err);
  }
  setLang('fr');
  setView('search');
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
